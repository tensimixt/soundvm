name: Build and Push to Replicate

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Replicate's registry
        uses: docker/login-action@v2
        with:
          registry: r8.im
          username: ${{ secrets.REPLICATE_USERNAME }}
          password: ${{ secrets.REPLICATE_TOKEN }}

      - name: Build and Push Docker image
        run: |
          # Use the first 7 chars of the commit SHA as the version
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "Building Docker image with tag: $SHORT_SHA"
          
          docker build -t r8.im/tensimixt/melbandrm:${SHORT_SHA} .
          docker push r8.im/tensimixt/melbandrm:${SHIONRT_SHA}"

          # Optional: Tag as 'latest'
          docker tag r8.im/tensimixt/melbandrm:${SHORT_SHA} r8.im/tensimixt/melbandrm:latest
          docker push r8.im/tensimixt/melbandrm:latest
