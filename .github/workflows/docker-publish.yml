name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (versioned)
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "Building Docker image with tag: $SHORT_SHA"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/melband-roformer:${SHORT_SHA} .

      - name: Push Docker image (versioned)
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "Pushing image tag: $SHORT_SHA"
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/melband-roformer:${SHORT_SHA}

      - name: Tag and push as 'latest'
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/melband-roformer:${SHORT_SHA} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/melband-roformer:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/melband-roformer:latest

      - name: Install Cog
        run: |
          sudo curl -o /usr/local/bin/cog -L https://github.com/replicate/cog/releases/latest/download/cog_`uname -s`_`uname -m`
          sudo chmod +x /usr/local/bin/cog

      - name: Build and push to Replicate
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_TOKEN }}
        run: |
          cog build
          cog push r8.im/tensimixt/melbandrm
