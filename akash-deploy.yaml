version: "2.0"

services:
  web:
    image: tensimixt/melband-roformer:vocal-separator-latest
    expose:
      - port: 80
        as: 80
        proto: tcp
        to:
          - global: true

profiles:
  compute:
    web:
      resources:
        cpu:
          units: "2"
        memory:
          size: "8Gi"
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                # Request low-cost NVIDIA GPUs (e.g., A10, A6000, RTX4090)
                - model: a10
                - model: rtx4090
                - model: a6000
        storage:
          size: "10Gi"
  
  placement:
    default:
      attributes: {}
      pricing:
        web:
          denom: uakt
          amount: 500
          
deployment:
  web:
    default:
      profile: web
      count: 1
